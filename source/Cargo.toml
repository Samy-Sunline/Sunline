[package]
name = "sunline"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ar-reshaper = "1.5"
unicode-bidi = "0.3"

[profile.release]
opt-level = 2
strip = true

[build-dependencies]
winresource = "0.1"
